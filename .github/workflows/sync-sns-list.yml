name: 自動追加中リスト_SNS広告求人 の新着取込

# クロール結果（IMPORTRANGE の取込元）から未取込の行だけを作業シートに追記する。
# H列(入力状況) / I列(送信日時) は書き込み対象外なので、外部作業者の入力は消えない・ズレない。
#
# 必要な Secrets（会社 Mac で `bash sync_gog_token.sh --gh-secrets` を実行すると設定される）:
#   GOG_CREDENTIALS_B64 / GOG_TOKEN_EXPORT_B64 / GOG_KEYRING_PASSWORD

on:
  schedule:
    # 3時間おき（UTC。取込元のクロールは日次なのでこの頻度で十分）
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '追記せず対象件数だけ確認する'
        type: boolean
        default: false

concurrency:
  group: sync-sns-list
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOG_CREDENTIALS_B64: ${{ secrets.GOG_CREDENTIALS_B64 }}
      GOG_TOKEN_EXPORT_B64: ${{ secrets.GOG_TOKEN_EXPORT_B64 }}
      GOG_KEYRING_PASSWORD: ${{ secrets.GOG_KEYRING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Secrets 未登録の間は「失敗」ではなく「スキップ」にする。
      # 本番の取込は Claude の Routine が担っているので、ここが止まっていても実害は無い。
      # 未登録のまま cron が失敗し続けると 3時間ごとに失敗通知が飛ぶだけになる（2026-09 実測: 153連続失敗）。
      - name: Secrets の有無を確認
        id: secrets
        run: |
          missing=0
          for v in GOG_CREDENTIALS_B64 GOG_TOKEN_EXPORT_B64 GOG_KEYRING_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::warning::Secret $v が未設定のため取込をスキップ"; missing=1; fi
          done
          if [ "$missing" = 1 ]; then
            echo "クラウド(web)のセッション環境変数に入っている3値を GitHub Secrets に貼れば動く（CLAUDE.md 参照）" >&2
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: gog セットアップ
        if: steps.secrets.outputs.ready == 'true'
        run: bash setup_gog_remote.sh

      - name: gws セットアップ
        if: steps.secrets.outputs.ready == 'true'
        run: |
          export PATH="$HOME/bin:$PATH"
          bash setup_gws_remote.sh

      - name: 新着取込
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -o pipefail
          export PATH="$HOME/bin:$HOME/.local/bin:$PATH"
          export GOOGLE_WORKSPACE_CLI_CREDENTIALS_FILE="$HOME/.config/gws/credentials.json"
          export GOOGLE_WORKSPACE_CLI_KEYRING_BACKEND=file
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          python3 sheets/hirogaru_form_sheet/sync_new_rows.py $ARGS | tee result.txt

      - name: 実行結果をサマリに出す
        if: always() && steps.secrets.outputs.ready == 'true'
        run: |
          echo '### 新着取込の結果' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          { cat result.txt 2>/dev/null || echo '(出力なし。前のステップで失敗しています)'; } >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
