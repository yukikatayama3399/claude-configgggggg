<title>BALL 完成イメージ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: Mac アプリのウィンドウ1枚。上=プロジェクトタブ、左=ボール一覧、中=タスクごとのAI、右=スレッド/ブラウザ、下=同期状況 */
:root{
  --page:#E4E8EE; --win:#FFFFFF; --side:#F5F7FA; --ink:#18212B; --muted:#637083; --line:#DEE3EA; --soft:#EEF1F5;
  --chrome:#1C2632; --chrome-ink:#E6ECF3; --chrome-muted:#93A1B2;
  --me:#B86200; --me-bg:#FFF0DB; --them:#3C5E93; --them-bg:#E6EEFA; --ai:#0D7B6C; --ai-bg:#DDF3EE;
  --warn:#B42318; --warn-bg:#FDE8E6; --send:#1E7B4E; --cell:#FFF4CC;
  --p-hawk:#2F6FDE; --p-uuum:#D6336C; --p-alpaka:#7A5AF8; --p-in:#64748B; --p-me:#12A594;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#080C11; --win:#131A22; --side:#0F151C; --ink:#E6EBF1; --muted:#95A2B3; --line:#25303C; --soft:#1A232D;
  --chrome:#0A0F14; --chrome-ink:#E6ECF3; --chrome-muted:#8291A3;
  --me:#F2A14A; --me-bg:#38280F; --them:#8EB2EA; --them-bg:#1A2940; --ai:#4CC9B6; --ai-bg:#0F2E29;
  --warn:#F3877D; --warn-bg:#3B1B19; --send:#2E9E66; --cell:#3A3112; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#080C11; --win:#131A22; --side:#0F151C; --ink:#E6EBF1; --muted:#95A2B3; --line:#25303C; --soft:#1A232D;
  --chrome:#0A0F14; --chrome-ink:#E6ECF3; --chrome-muted:#8291A3;
  --me:#F2A14A; --me-bg:#38280F; --them:#8EB2EA; --them-bg:#1A2940; --ai:#4CC9B6; --ai-bg:#0F2E29;
  --warn:#F3877D; --warn-bg:#3B1B19; --send:#2E9E66; --cell:#3A3112; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:13.5px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 16px;
  display:grid;grid-template-rows:auto 1fr;gap:10px}
button,textarea,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--me);outline-offset:2px}
.cap{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;font-size:12px;color:var(--muted)}
.cap b{color:var(--ink);font-size:13px}
.app{background:var(--win);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;min-height:0;box-shadow:0 18px 50px -20px rgba(10,20,30,.35)}
/* title bar */
.tb{background:var(--chrome);color:var(--chrome-ink);display:flex;align-items:center;gap:14px;padding:8px 14px;min-width:0;overflow-x:auto}
.dots{display:flex;gap:7px;flex:none}.dots i{width:11px;height:11px;border-radius:50%;background:#FF5F57}.dots i:nth-child(2){background:#FEBC2E}.dots i:nth-child(3){background:#28C840}
.logo{font-weight:900;letter-spacing:.08em;font-size:15px;display:flex;align-items:center;gap:7px;flex:none}
.logo .b{width:14px;height:14px;border-radius:50%;background:var(--me);box-shadow:inset -3px -3px 0 rgba(0,0,0,.18)}
.today{font-family:var(--f-mono);font-size:11px;color:var(--chrome-muted);flex:none}
.ptabs{display:flex;gap:2px;flex:none}
.ptabs button{background:transparent;border:0;color:var(--chrome-muted);padding:3px 10px;border-radius:6px;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;white-space:nowrap}
.ptabs button[aria-pressed="true"]{background:rgba(255,255,255,.12);color:var(--chrome-ink)}
.pd{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.tb .sp{flex:1}
.sync{font-size:11px;color:var(--chrome-muted);display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.sync i{width:7px;height:7px;border-radius:50%;background:#3CCB7F}
/* columns */
.cols{display:grid;grid-template-columns:300px minmax(0,1fr) minmax(0,1.08fr);min-height:0}
.col{min-width:0;min-height:0;display:grid}
.left{background:var(--side);border-right:1px solid var(--line);overflow-y:auto;padding:12px;align-content:start;gap:12px}
.center{grid-template-rows:auto auto 1fr auto;border-right:1px solid var(--line)}
.right{grid-template-rows:auto 1fr}
.date{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.add{display:flex;gap:6px;background:var(--win);border:1px solid var(--line);border-radius:9px;padding:5px 5px 5px 10px;align-items:center}
.add input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:13px}
.btn{border:1px solid var(--line);background:var(--win);border-radius:7px;padding:4px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.btn.dark{background:var(--ink);color:var(--win);border-color:var(--ink)}
.btn.send{background:var(--send);color:#fff;border-color:var(--send)}
.banto{background:var(--win);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
.banto h3{margin:0;font-size:13.5px;font-weight:900;display:flex;justify-content:space-between;align-items:baseline}
.banto h3 span{font-weight:400;font-size:11px;color:var(--muted)}
.jobs{display:grid;gap:4px;font-size:11.5px}
.job{display:grid;grid-template-columns:auto 1fr;gap:6px;align-items:baseline;color:var(--muted)}
.job b{font-family:var(--f-mono);font-size:10px;font-weight:600;padding:0 5px;border-radius:4px}
.job b.run{background:var(--ai-bg);color:var(--ai)} .job b.ok{background:var(--soft);color:var(--muted)}
.sec{display:grid;gap:5px}
.sech{font-size:11.5px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;align-items:center;padding:0 2px}
.sech .n{font-family:var(--f-mono);font-weight:600}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:30px 1fr;gap:9px;padding:9px;border-radius:9px;border:1px solid transparent;background:transparent}
.card:hover{background:var(--win)}
.card.me{background:var(--me-bg)}
.card[aria-current="true"]{border-color:var(--ink);background:var(--win)}
.card:focus-visible{outline:2px solid var(--me)}
.ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-mono);font-size:10.5px;font-weight:600;color:#fff}
.ic.s-slack{background:#4A154B}.ic.s-gmail{background:#C5221F}.ic.s-msgr{background:#0866FF}.ic.s-cal{background:#1A73E8}.ic.s-form{background:#5B6B7F}.ic.s-doc{background:#1F7A4D}
.ct{min-width:0;display:grid;gap:2px}
.ct .t{font-weight:700;font-size:13px;line-height:1.45}
.ct .m{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:11px;color:var(--muted)}
.chip{font-size:10.5px;font-weight:700;padding:0 7px;border-radius:999px;white-space:nowrap}
.c-warn{background:var(--warn-bg);color:var(--warn)} .c-me{background:var(--win);color:var(--me);border:1px solid currentColor} .c-ai{background:var(--ai-bg);color:var(--ai)} .c-them{background:var(--them-bg);color:var(--them)}
.proj{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--ink)}
.ev{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:6px 9px;border-radius:8px;font-size:12px;cursor:pointer;border:1px solid transparent;background:transparent;text-align:left}
.ev:hover{background:var(--win)} .ev[aria-current="true"]{border-color:var(--ink);background:var(--win)}
.ev time{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.closed{font-size:11.5px;color:var(--muted);display:grid;gap:3px;padding:0 4px}
.closed s{color:var(--muted)}
/* center */
.ch{display:flex;align-items:center;gap:10px;padding:12px 16px 8px;min-width:0;flex-wrap:wrap}
.ch h2{margin:0;font-size:16px;font-weight:900;line-height:1.4;text-wrap:balance;min-width:0}
.ctabs{display:flex;gap:4px;padding:0 16px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ctabs button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 12px;font-size:12px;font-weight:700;color:var(--muted)}
.ctabs button[aria-pressed="true"]{background:var(--ink);color:var(--win);border-color:var(--ink)}
.feed{overflow-y:auto;padding:14px 16px;display:grid;gap:12px;align-content:start;min-height:0}
.prog{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.prog b{color:var(--ink);font-weight:600}
.bub{white-space:pre-wrap;font-size:13.5px;line-height:1.8}
.bub.ai{border-left:3px solid var(--ai);padding:2px 0 2px 12px}
.bub.me{justify-self:end;background:var(--soft);border-radius:12px;padding:7px 12px;max-width:80%}
.memo{white-space:pre-wrap;background:var(--soft);border-radius:10px;padding:14px;font-size:13.5px;line-height:1.9;min-height:200px}
.st{font-size:11.5px;color:var(--muted);padding:6px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
.st b{color:var(--ink)}
.comp{padding:0 16px 12px;display:grid;gap:8px}
.comp textarea{width:100%;min-height:74px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--win);font-size:13.5px;line-height:1.7}
.crow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crow select{border:1px solid var(--line);border-radius:7px;background:var(--win);padding:3px 8px;font-size:12px}
.crow .sp{flex:1}
.hint{font-size:11px;color:var(--muted)}
/* right */
.rtabs{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line);align-items:center}
.rtabs button{border:0;background:transparent;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:700;color:var(--muted)}
.rtabs button[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
.rbody{overflow-y:auto;min-height:0;display:grid;align-content:start}
.thr{padding:14px 16px;display:grid;gap:12px}
.thr h4{margin:0;font-size:14.5px;font-weight:900;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.thr h4 span{font-size:11px;font-weight:400;color:var(--muted)}
.sm{display:grid;grid-template-columns:34px 1fr;gap:9px}
.av{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.sm .n{font-weight:900;font-size:13px}.sm .n time{font-weight:400;color:var(--muted);font-size:11px;margin-left:6px}
.sm .x{white-space:pre-wrap;font-size:13px;line-height:1.75}
.react{display:inline-flex;gap:4px;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-top:4px}
.draft{border:1px solid var(--line);border-radius:10px;overflow:hidden;display:grid}
.dh{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;background:var(--ai-bg);color:var(--ai);padding:6px 10px;font-weight:700}
.dh a{color:var(--ai);font-weight:400}
.tool{display:flex;gap:2px;padding:5px 8px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:12px;color:var(--muted);flex-wrap:wrap}
.tool span{padding:0 6px}
.draft textarea{border:0;outline:0;resize:vertical;min-height:150px;padding:10px 12px;background:var(--win);font-size:13px;line-height:1.8;width:100%}
.df{display:flex;align-items:center;gap:8px;padding:6px 10px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);flex-wrap:wrap}
.df .sp{flex:1}
.mail{display:grid;gap:10px}
.mh{display:grid;gap:2px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:10px}
.mh .s{font-size:15px;font-weight:900;color:var(--ink)}
.mb{white-space:pre-wrap;font-size:13px;line-height:1.85}
/* browser */
.brw{display:grid;grid-template-rows:auto auto 1fr;min-height:100%}
.btabs{display:flex;gap:2px;background:var(--soft);padding:6px 8px 0;overflow-x:auto}
.btab{display:flex;align-items:center;gap:6px;font-size:11.5px;padding:5px 10px;border-radius:7px 7px 0 0;background:transparent;border:0;white-space:nowrap;color:var(--muted);max-width:220px}
.btab span{overflow:hidden;text-overflow:ellipsis}
.btab[aria-pressed="true"]{background:var(--win);color:var(--ink);font-weight:700}
.fav{width:12px;height:12px;border-radius:3px;flex:none}
.url{display:flex;gap:10px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:11.5px;color:var(--muted);min-width:0}
.url .u{flex:1;min-width:0;background:var(--soft);border-radius:999px;padding:3px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.page{padding:14px 16px;display:grid;gap:12px;align-content:start;min-width:0}
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;font-size:12px;width:100%;min-width:560px}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:700;font-size:11px;color:var(--muted)}
td.new{background:var(--cell)}
.sheettitle{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700}
.sheettitle i{width:16px;height:16px;border-radius:3px;background:#1E8E3E;display:inline-block}
.legend{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;background:var(--cell);border:1px solid var(--line);display:inline-block}
.ms{display:grid;grid-template-columns:200px 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:380px}
.ml{border-right:1px solid var(--line);display:grid;align-content:start}
.mc{display:grid;grid-template-columns:36px 1fr auto;gap:8px;padding:9px 10px;font-size:12px;align-items:center}
.mc.on{background:var(--soft)}
.mc .av{width:36px;height:36px;border-radius:50%}
.mc .p{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc .u{width:9px;height:9px;border-radius:50%;background:#0866FF}
.mv{display:grid;grid-template-rows:auto 1fr auto;min-width:0}
.mvh{padding:9px 12px;border-bottom:1px solid var(--line);font-weight:900;font-size:13px}
.mvb{padding:12px;display:grid;gap:8px;align-content:end}
.mm{max-width:80%;padding:7px 12px;border-radius:18px;font-size:13px;background:var(--soft);white-space:pre-wrap}
.mm.out{justify-self:end;background:#0866FF;color:#fff}
.mm.dr{justify-self:end;background:transparent;border:1px dashed #0866FF;color:var(--ink)}
.mvi{border-top:1px solid var(--line);padding:8px 12px;font-size:12px;color:var(--muted)}
.doc{background:var(--win);border:1px solid var(--line);border-radius:6px;padding:22px 26px;display:grid;gap:10px;font-size:13px;line-height:1.85}
.doc h5{margin:0;font-size:17px;font-weight:900}
.doc h6{margin:6px 0 0;font-size:13.5px;font-weight:900}
.doc ul{margin:0;padding-left:1.2em}
.calv{border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:8px}
.calv .tt{font-size:16px;font-weight:900;display:flex;gap:8px;align-items:center}
.calv .tt i{width:12px;height:12px;border-radius:3px;background:#1A73E8}
.kv{display:grid;grid-template-columns:5em 1fr;gap:4px 10px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.empty{padding:30px 16px;color:var(--muted);font-size:12.5px}
/* footer */
.ft{display:flex;gap:16px;align-items:center;padding:5px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);background:var(--side);overflow-x:auto;white-space:nowrap}
.ft .ok{display:inline-flex;gap:5px;align-items:center}.ft .ok i{width:6px;height:6px;border-radius:50%;background:#3CCB7F}
.bar{display:inline-block;width:70px;height:5px;background:var(--line);border-radius:3px;overflow:hidden;vertical-align:middle;margin:0 4px}
.bar i{display:block;height:100%;background:var(--ai)}
.ft .sp{flex:1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--win);padding:8px 16px;border-radius:999px;font-size:12.5px;max-width:calc(100% - 32px)}
@media (max-width:1100px){.cols{grid-template-columns:260px minmax(0,1fr)}.right{grid-column:1/-1;border-top:1px solid var(--line);min-height:520px}}
@media (max-width:720px){html,body{height:auto}.cols{display:block}.left{max-height:none}.center{border-right:0;border-top:1px solid var(--line);min-height:520px}.ms{grid-template-columns:1fr}.ml{border-right:0;border-bottom:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="cap"><b>BALL 完成イメージ</b><span>Mac のデスクトップアプリとして動く想定。左のボールを押すと中と右が切り替わります。中身は実データ（11/3 時点）をもとにした例で、細部は事実と違うことがあります。送信・書き込みはどこにもしません。</span></div>

<div class="app">
  <div class="tb">
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="logo"><span class="b" aria-hidden="true"></span>BALL</div>
    <span class="today">11/4（火）在宅 · 稼働 2.1h</span>
    <div class="ptabs" id="ptabs" role="group" aria-label="プロジェクト"></div>
    <span class="sp"></span>
    <span class="sync"><i></i>同期 1分前</span>
  </div>

  <div class="cols">
    <aside class="col left" aria-label="ボール一覧">
      <div class="date"><span>TUE, NOV 4</span><span id="meCount"></span></div>
      <form class="add" id="addForm"><input id="addInput" aria-label="ボールを追加" placeholder="ボールを追加（話してもOK）"><button class="btn dark" type="submit">追加</button></form>
      <div class="banto">
        <h3>番頭 <span>まとめ役の AI · 3分前</span></h3>
        <form class="add" id="bantoForm" style="padding:4px 4px 4px 9px"><input id="bantoInput" aria-label="番頭に頼む" placeholder="ざっくり頼む（誰に振るかは番頭が決める）"><button class="btn dark" type="submit">送信</button></form>
        <div class="jobs" id="jobs"></div>
      </div>
      <div id="sections"></div>
    </aside>

    <section class="col center" aria-label="このボールの AI">
      <div class="ch" id="chHead"></div>
      <div class="ctabs" role="group" aria-label="表示切替">
        <button type="button" id="ct-chat" aria-pressed="true">チャット</button>
        <button type="button" id="ct-memo" aria-pressed="false">メモ</button>
      </div>
      <div class="feed" id="feed"></div>
      <div>
        <div class="st" id="state"></div>
        <form class="comp" id="comp">
          <textarea id="compText" aria-label="メッセージ" placeholder="メッセージ（Aqua Voice の音声入力もそのまま入ります · ⌘Enter で送信）"></textarea>
          <div class="crow">
            <select id="perm" aria-label="AI の権限"><option>下書きまで</option><option>シート記入まで</option><option>読むだけ</option></select>
            <select id="model" aria-label="モデル"><option>Opus 5.5</option><option>Sonnet 5.5</option></select>
            <span class="sp"></span><span class="hint">送信はしません</span>
            <button class="btn dark" type="submit">送信</button>
          </div>
        </form>
      </div>
    </section>

    <section class="col right" aria-label="元のやり取り">
      <div class="rtabs" role="group" aria-label="右ペイン">
        <button type="button" id="rt-thread" aria-pressed="true">スレッド</button>
        <button type="button" id="rt-browser" aria-pressed="false">ブラウザ</button>
      </div>
      <div class="rbody" id="rbody"></div>
    </section>
  </div>

  return `<div class="brw"><div class="btabs">${b.tabs.map((x,k)=>`<button type="button" class="btab" data-tab="${k}" aria-pressed="${k===b.on}"><i class="fav" style="background:${x[2]}"></i><span>${esc(x[1])}</span></button>`).join("")}<button type="button" class="btab" aria-label="新しいタブ">＋</button></div>
  <div class="url"><span>‹ › ↻</span><span class="u">${esc(t[3])}</span></div><div class="page">${pageOf(t[0],i)}</div></div>`;
}

  }

    const rows=[["A","FO 指名","4","送付済み"],["A","業態一致・中規模以上","5","今週アポ打診"],["B","業態一致・小規模","31","お礼＋資料"],["C","業態外","25","ナーチャリング"]];
    return `<div class="sheettitle"><i></i>共催ウェビナー_参加者（10/27）</div><div class="gridwrap"><table><thead><tr><th>区分</th><th>条件</th><th>件数</th><th>対応</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,j)=>`<td class="${j===3?"new":""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  if(k==="messenger"){
    return `<div class="ms"><div class="ml">
      <div class="mc on"><span class="av" style="background:${COL.msgrA}">K</span><div style="min-width:0"><b>K さん（例）</b><div class="p">来週どこかでお茶しませんか？</div></div><i class="u"></i></div>

      <div class="mm">片山さん、来週どこかでお茶しませんか？紹介したい会社があって</div>
      <div class="mm">SNS 広告まわりで困ってるところです</div>
      <div class="mm dr">ありがとうございます！ぜひ。\n11/10（月）16時〜、11/12（水）17時〜、11/13（木）11時〜あたりどうでしょう？\n（AI 下書き · 未送信）</div>
    </div><div class="mvi">Aa　メッセージを入力</div></div></div>`;
  }
  if(k==="gemini"||k==="gemini2"){
    const a=k==="gemini";
    return `<div class="doc"><h5>${a?"朝日コネクト・HAWK":"シーラベル様 × HAWK"} - Gemini によるメモ</h5><span class="hint">${a?"2026/10/30 14:00":"2026/11/02 12:00"} · 自動生成</span>
    <h6>概要</h6><p>${a?"HAWK の機能と2週間トライアルの流れを説明。秦様から運用体制についての質問あり。":"2027年1月の共催オンライン選定会について、登壇の方向性と進め方を相談。"}</p>
    <h6>次のステップ</h6><ul><li>[片山] ${a?"検討状況を11/5に確認する":"登壇者と概要を11月中に連絡する"}</li><li>[${a?"秦":"佐藤"}] ${a?"社内で体制を確認する":"当日の進行案を共有する"}</li></ul></div>`;
  }
  if(k==="doc"||k==="doc2"){
    return k==="doc"?`<div class="doc"><h5>Meta 広告データ利用規約（メモ）</h5><h6>確認ポイント</h6><ul><li>レポートデータの第三者提供の条件</li><li>rawデータの保持期間</li><li>TikTok 側の同等条項</li></ul><p class="hint">AI が調べて書き足します</p></div>`
    :`<div class="doc"><h5>株式会社静鉄アド・パートナーズ 会社概要</h5><span class="hint">hawk-inbound-lead が作成中</span><h6>基本情報</h6><p>所在地・事業内容・主要取引先を整理中</p><h6>HAWK との接点</h6><p>紹介パートナー申込（11/3）</p></div>`;
  }
  if(k==="calev"){
    return `<div class="calv"><div class="tt"><i></i>[オンライン社外]【仮】リアルテックジャパン様（楳田様）／HAWKご説明</div>

  items.unshift({id:"n"+Date.now(),sec:"me",proj:"in",src:"doc",title:t,sub:"手入力",chips:[["新規","me"]],ago:"今",feed:[["ai","ボールにしました。関係するスレッドや予定があれば紐づけます。"]],memo:"",thread:null,browser:{tabs:[["x","新しいタブ","#999","about:blank"]],on:0}});
  $("addInput").value="";select(items[0].id);};

ptabs();select("iwata");
