<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAWK トライアル</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--ink:#1f2328;--sub:#6a717b;--faint:#9aa1aa;--line:#e4e7eb;--chip:#eef1f4;--hover:#f7f8fa;
  --green:#1aa86b;--green-d:#128556;--green-bg:#e9f8f1;--green-line:#bfe8d4;
  --orange:#e8742a;--orange-bg:#fff4ea;--orange-line:#f7d2b5;
  --blue:#2f6fda;--blue-bg:#edf3fd;--blue-line:#c8d9f6;
  --red:#d1344b;--red-bg:#fdeef0;--red-line:#f4c4cc;
  --camp:#d1346b;--adset:#1aa86b;--ad:#e3a008;
  --est:#d8f3e8;--shadow:0 8px 30px rgba(15,23,42,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121417;--card:#1b1f24;--ink:#e7e9ec;--sub:#a3aab3;--faint:#727a84;--line:#2e343b;--chip:#262b31;--hover:#22272d;
  --green-bg:#16302a;--green-line:#24533f;--orange-bg:#33251a;--orange-line:#5a3b22;--blue-bg:#18263b;--blue-line:#2a4166;--red-bg:#3a1c22;--red-line:#64303a;--est:#173a2d;--shadow:0 8px 30px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#121417;--card:#1b1f24;--ink:#e7e9ec;--sub:#a3aab3;--faint:#727a84;--line:#2e343b;--chip:#262b31;--hover:#22272d;
  --green-bg:#16302a;--green-line:#24533f;--orange-bg:#33251a;--orange-line:#5a3b22;--blue-bg:#18263b;--blue-line:#2a4166;--red-bg:#3a1c22;--red-line:#64303a;--est:#173a2d;--shadow:0 8px 30px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;font-size:14px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}a{color:var(--green-d)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid var(--green-line);border-color:var(--green)}
.hidden{display:none!important}
/* header */
header{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 20px;height:60px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;letter-spacing:.03em;margin-right:18px;cursor:pointer;white-space:nowrap}
.trial-badge{font-size:11px;font-weight:700;background:#fff3cd;color:#7a5600;border-radius:99px;padding:2px 9px;letter-spacing:0}
nav{display:flex;gap:2px;flex:1;min-width:0}
.menu{position:relative}.menu>button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--ink);font-size:15px;white-space:nowrap}
.menu>button::after{content:"▾";font-size:10px;color:var(--faint);margin-left:6px}.menu>button:hover,.menu.open>button{background:var(--chip)}
.menu .dd{position:absolute;top:44px;left:0;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:210px;padding:6px;display:none}
.menu.open .dd{display:block}.dd button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:7px}
.dd button:hover{background:var(--green-bg)}.dd .lock{font-size:11px;color:var(--faint)}
.hright{display:flex;align-items:center;gap:14px;margin-left:auto}
.who{line-height:1.25;font-size:12px}.who b{display:block;font-size:13px}.who span{color:var(--sub)}
.hbtn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;white-space:nowrap}.hbtn:hover{background:var(--hover)}
.days{font-size:12px;color:var(--sub);white-space:nowrap}.days b{color:var(--orange)}
main{max-width:1320px;margin:0 auto;padding:22px 24px 60px}
/* common */
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:8px;padding:9px 16px;font-weight:700;background:var(--green);color:#fff;white-space:nowrap}
.btn:hover{background:var(--green-d)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500}.btn.ghost:hover{background:var(--hover)}
.btn.sm{padding:5px 10px;font-size:12px}.btn.danger{background:var(--red-bg);color:var(--red);border:1px solid var(--red-line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border-radius:6px;padding:3px 9px;font-size:12px;margin:0 6px 6px 0}
.chip button{background:none;border:0;padding:0 0 0 2px;color:var(--faint);font-size:13px;line-height:1}
.muted{color:var(--sub)}.small{font-size:12px}.tiny{font-size:11px}
h1.page{font-size:22px;margin:0}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 8px;color:#fff}
.pill.camp{background:var(--camp)}.pill.adset{background:var(--adset)}.pill.ad{background:var(--ad)}
.platform-ico{display:inline-flex;gap:3px;vertical-align:middle}
.ico{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff}
.ico.fb{background:#1877f2}.ico.ig{background:linear-gradient(45deg,#f9a825,#e1306c,#833ab4)}.ico.tt{background:#111}
/* brief list */
.search{padding:14px 16px;margin-bottom:14px}.search label{font-size:12px;color:var(--sub)}
table.list{width:100%;border-collapse:collapse}
.list th{font-size:13px;text-align:left;color:var(--ink);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.list td{padding:14px;border-bottom:1px solid var(--line);vertical-align:top}
.list tr:hover td{background:var(--hover)}
.bname{font-size:16px;font-weight:600;cursor:pointer}.bname:hover{color:var(--green-d)}
.notebox{background:var(--chip);border-radius:8px;padding:8px 10px;font-size:12px;max-height:92px;overflow:hidden;white-space:pre-wrap;max-width:320px}
.mini{display:flex;flex-direction:column;gap:5px}.mini button{border-radius:7px;padding:5px 10px;font-size:12px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.b-aud{background:var(--orange-bg);border:1px solid var(--orange-line);color:var(--orange)}
.b-est{background:var(--blue-bg);border:1px solid var(--blue-line);color:var(--blue)}
.b-dlv{background:var(--green-bg);border:1px solid var(--green-line);color:var(--green-d)}
.empty{text-align:center;padding:50px 20px;color:var(--sub)}
/* brief detail */
.dhead{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.dhead h1{font-size:22px;margin:0;flex:1}.back{background:none;border:0;font-size:22px;color:var(--sub);padding:0 8px}
.dgrid{display:grid;grid-template-columns:330px minmax(0,1fr) 300px}
.dcol{padding:18px 22px;min-width:0}.dcol+.dcol{border-left:1px solid var(--line)}
.dcol h3{margin:0 0 12px;font-size:17px}
.noteinput{position:relative}.noteinput textarea{min-height:120px;padding-bottom:40px}
.noteinput .send{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;border:0;background:var(--green);color:#fff;font-size:18px}
.noteinput .send:disabled{opacity:.4}
.tmpl{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}.tmpl button{font-size:11px;border:1px dashed var(--line);background:none;border-radius:6px;padding:2px 8px;color:var(--sub)}
.note{background:var(--chip);border-radius:10px;padding:12px 14px;margin-bottom:10px;white-space:pre-wrap;font-size:13px;word-break:break-word}
.note .at{color:var(--sub);font-size:12px;margin-bottom:4px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{background:none;border:0;padding:8px 16px;font-size:15px;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--green-d);border-color:var(--green);font-weight:700}
.sect{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sect>.sh{background:var(--hover);padding:10px 16px;font-weight:700;display:flex;align-items:center;gap:8px}
.frow{display:grid;grid-template-columns:130px 1fr 26px;gap:10px;align-items:center;padding:11px 16px;border-top:1px solid var(--line);min-height:52px}
.frow .k{color:var(--sub);font-size:13px}.frow .v{font-size:15px;cursor:pointer;border-radius:6px;padding:2px 6px;margin-left:-6px;min-height:26px;word-break:break-word}
.frow .v:hover{background:var(--hover)}.frow .v.blank{color:var(--faint);font-size:13px}
.frow .v .s{display:block;font-size:12px;color:var(--sub)}
.frow .x{background:none;border:0;color:var(--faint);font-size:16px}.frow .x:hover{color:var(--red)}
.frow.missing .v.blank{color:var(--red)}
.frow.flash{animation:flash 1.6s ease}@keyframes flash{0%{background:var(--green-bg)}100%{background:transparent}}
.frow .editor{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.frow .editor input,.frow .editor select{flex:1;min-width:110px}
.aibox{border:1px solid var(--green-line);background:var(--green-bg);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px}
.aibox h4{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:6px}.aibox ul{margin:4px 0 8px;padding-left:18px}.aibox li{margin:2px 0}
.aibox.warn{border-color:var(--orange-line);background:var(--orange-bg)}
.menuBtn{display:flex;align-items:center;gap:8px;width:100%;border-radius:8px;padding:11px 14px;font-weight:700;font-size:15px;margin-bottom:10px;text-align:left}
.lack{background:var(--red-bg);border:1px solid var(--red-line);border-radius:8px;padding:10px 14px;color:var(--red);font-size:13px;margin-bottom:12px}
.lack b{display:block;margin-bottom:2px}.lack ul{margin:0;padding-left:18px}
.made{border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
.madeitem{display:flex;align-items:center;gap:6px;margin-bottom:6px}.madeitem button.open{flex:1;min-width:0;text-align:left;border-radius:7px;padding:6px 10px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.madeitem .del{background:none;border:0;color:var(--faint);font-size:14px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:10px}
.ccard{position:relative;border:2px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:var(--chip);aspect-ratio:4/5}
.ccard img{width:100%;height:100%;object-fit:cover;display:block}.ccard.on{border-color:var(--green)}
.ccard .ck{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.9);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--green-d)}
.ccard.on .ck{background:var(--green);color:#fff;border-color:var(--green)}
.ccard .cn{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:11px;padding:14px 6px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px}.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;font-size:13px}.seg button.on{background:var(--card);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.fl{font-weight:700;margin:16px 0 6px;display:block}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,20,25,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto}
.modal{background:var(--card);border-radius:14px;width:min(1180px,100%);box-shadow:var(--shadow);margin:auto 0}
.modal.narrow{width:min(620px,100%)}
.mh{display:flex;align-items:center;gap:12px;padding:20px 26px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);border-radius:14px 14px 0 0;z-index:2}
.mh h2{margin:0;font-size:21px;flex:1;display:flex;align-items:center;gap:8px}.mh .close{background:none;border:0;font-size:26px;line-height:1;color:var(--ink)}
.mb{padding:22px 26px}.mf{padding:16px 26px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:var(--card);border-radius:0 0 14px 14px}
.titleedit{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;margin-bottom:6px}.titleedit input{max-width:520px;font-weight:700}
/* audience */
.kv4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
.kv4>div{border:1px solid var(--line);border-radius:8px;padding:8px 14px}.kv4 .k{font-size:12px;color:var(--sub)}.kv4 .v{font-weight:700}
.total{border:1px solid var(--line);border-radius:8px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.total b{font-size:20px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.plan{border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;position:relative}.plan.on{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange-line)}
.plan .ph{display:flex;justify-content:space-between;font-weight:700;font-size:16px}.plan .sz{font-weight:600;margin:8px 0}
.bar{height:8px;border-radius:9px;background:var(--chip);overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--orange);border-radius:9px}
.plan .use{position:absolute;top:-10px;right:12px;background:var(--orange);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 9px}
.addint{display:flex;gap:6px;margin-top:6px}.addint input{font-size:12px;padding:5px 8px}
/* estimate */
.esttab{width:100%;border-collapse:separate;border-spacing:0 6px}
.esttab th{font-size:12px;color:var(--sub);font-weight:600;text-align:right;padding:2px 10px}.esttab th.grp{text-align:left;font-size:15px;color:var(--ink);font-weight:700}
.esttab td{padding:8px 10px;text-align:right;white-space:nowrap}.esttab td.m{text-align:left;font-weight:700}
.esttab td.n{position:relative;font-weight:600}.esttab td.n i{position:absolute;left:0;top:3px;bottom:3px;background:var(--est);border-radius:4px;z-index:0}.esttab td.n span{position:relative;z-index:1}
.esttab .u{color:var(--sub);font-size:11px;margin-right:4px}
.esttab input{width:78px;padding:3px 6px;text-align:right;font-size:13px;display:inline-block}
.gap{width:24px}
.refs{width:100%;border-collapse:collapse;font-size:12px}.refs th{color:var(--sub);text-align:right;padding:8px;border-bottom:1px solid var(--line);font-weight:600}.refs th:first-child,.refs td:first-child{text-align:left}
.refs td{padding:8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}.refs td .s{display:block;color:var(--sub);font-size:11px}
.kpicmp{display:inline-block;font-size:12px;border-radius:6px;padding:2px 8px;margin-left:8px}.kpicmp.ok{background:var(--green-bg);color:var(--green-d)}.kpicmp.ng{background:var(--orange-bg);color:var(--orange)}
.warnline{color:var(--orange);font-size:12px;margin-top:4px}
.cond{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 16px;font-size:13px}.cond div span{display:block;color:var(--sub);font-size:11px}
/* delivery */
.dl-head{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}.dl-head .k{font-size:12px;color:var(--sub)}
.lvl{border:1px solid var(--line);border-left:4px solid var(--camp);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.lvl.adset{border-left-color:var(--adset);margin-left:14px}.lvl.ad{border-left-color:var(--ad);margin-left:28px}
.lvl .nm{font-weight:700;font-size:16px;margin:8px 0 10px}
.lvl .tools{float:right;display:flex;gap:6px}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 18px}
.fgrid .k{font-size:12px;color:var(--sub)}.fgrid .v{font-weight:500;word-break:break-word}.fgrid .s{display:block;font-size:11px;color:var(--faint)}
.fgrid .w2{grid-column:span 2}.fgrid .w4{grid-column:1/-1}
.fgrid label.k{display:block;margin-bottom:3px}
.adthumb{width:120px;aspect-ratio:4/5;border-radius:8px;object-fit:cover;background:var(--chip);border:1px solid var(--line)}
.picker{display:flex;gap:8px;flex-wrap:wrap}.picker img{width:64px;aspect-ratio:4/5;object-fit:cover;border-radius:6px;border:2px solid var(--line);cursor:pointer}.picker img.on{border-color:var(--green)}
.fixed{font-size:12px;color:var(--sub);background:var(--hover);border-radius:8px;padding:8px 12px;margin-top:8px}
/* confirm page */
.confirm{max-width:980px;margin:0 auto}
.ctable{width:100%;border-collapse:collapse}.ctable th{width:200px;text-align:left;font-weight:600;color:var(--sub);font-size:13px;padding:11px 16px;border-top:1px solid var(--line);vertical-align:top}
.ctable td{padding:11px 16px;border-top:1px solid var(--line);word-break:break-word}.ctable tr:first-child th,.ctable tr:first-child td{border-top:0}
.chead{padding:12px 16px;font-weight:700;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);background:var(--hover);border-radius:12px 12px 0 0}
.offer{border:2px solid var(--orange);background:var(--orange-bg);border-radius:12px;padding:18px 20px;margin:20px 0 14px}
.offer h3{margin:0 0 6px;font-size:17px;color:var(--orange)}.offer .code{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px dashed var(--orange);border-radius:8px;padding:6px 12px;font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:16px;margin:6px 0}
.linkbox{text-align:center;padding:22px}.linkbox label{display:flex;gap:8px;justify-content:center;align-items:center;margin-bottom:14px;color:var(--sub)}.linkbox label input{width:auto}
.lockbtn{position:relative}.lockbtn::before{content:"🔒 "}
/* locked page */
.locked{max-width:760px;margin:30px auto;text-align:center;padding:36px 30px}.locked h2{margin:6px 0 10px}.locked .big{font-size:40px}
/* progress */
.prog{padding:28px 30px}.prog .st{display:flex;align-items:center;gap:10px;padding:7px 0;color:var(--faint)}.prog .st.on{color:var(--ink);font-weight:600}.prog .st.done{color:var(--green-d)}
.prog .st i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;flex:none}
.prog .st.on i{border-color:var(--green);border-top-color:transparent;animation:spin .8s linear infinite}.prog .st.done i{background:var(--green);border-color:var(--green);color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1f2328;color:#fff;border-radius:10px;padding:10px 18px;z-index:80;box-shadow:var(--shadow);font-size:13px;max-width:90vw}
.guide{position:fixed;right:18px;bottom:18px;z-index:40;width:300px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.guide .gh{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700}.guide .gh button{margin-left:auto;background:none;border:0;color:var(--sub)}
.guide ol{margin:0;padding:10px 14px 12px 34px;font-size:13px}.guide li{margin:5px 0;color:var(--sub)}.guide li.done{color:var(--green-d);text-decoration:line-through}.guide li.now{color:var(--ink);font-weight:700}
.guidefab{position:fixed;right:18px;bottom:18px;z-index:40;border-radius:99px;box-shadow:var(--shadow)}
@media (max-width:1100px){.dgrid{grid-template-columns:1fr}.dcol+.dcol{border-left:0;border-top:1px solid var(--line)}.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  header{padding:0 12px;gap:2px;height:auto;min-height:56px;flex-wrap:wrap}nav{order:3;width:100%;overflow-x:auto;padding-bottom:6px}.logo{margin-right:4px}.who{display:none}.days{display:none}
  main{padding:14px 12px 60px}.plans,.kv4,.dl-head,.cond{grid-template-columns:1fr}.frow{grid-template-columns:92px 1fr 22px;padding:10px 12px}
  .mb{padding:16px}.mh{padding:14px 16px}.mf{padding:12px 16px}.list thead{display:none}.list td{display:block;border:0;padding:6px 14px}.list tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}
  .esttab{font-size:12px}.esttab input{width:58px}.lvl.adset{margin-left:6px}.lvl.ad{margin-left:12px}.ctable th{width:110px}.guide{left:12px;right:12px;width:auto}
  .esttab-wrap,.refs-wrap{overflow-x:auto}
}

function applyExtract(b, x, engine, secs) {

// 簡易読み取り（サーバーに AI が無いとき用）。精度は AI より落ちる
function ruleExtract(t, b) {

    placements: [], lp_url: "", ads: [], assumptions: ["簡易読み取りのため、内容を必ずご確認ください"], missing: [] };

  else x.placements = ["フィード", "ストーリーズ", "リール", "Facebookフィード"];
  const q = z.match(/([^\s「」、。:：]{2,20})の「([^」]+)」/); if (q) { x.client = q[1]; x.product = q[2]; }
  const c1 = z.match(/(広告主|クライアント)[:：\s]*([^\n]+)/); if (c1) x.client = c1[2].trim();
  const p1 = z.match(/(商材|商品)[:：\s]*([^\n]+)/); if (p1) x.product = p1[2].trim();
  const bm = z.match(/予算[^0-9\n]{0,10}([0-9][0-9,.]*)\s*(万|千)?/) || z.match(/([0-9][0-9,.]*)\s*万円?/);
  if (bm) { let v = parseFloat(bm[1].replace(/,/g, "")); if (bm[2] === "万" || (!bm[2] && /万/.test(bm[0]))) v *= 10000; else if (bm[2] === "千") v *= 1000; x.budget = Math.round(v); }

  const mg = z.match(/マージン[^0-9\n]{0,8}([0-9]{1,2})/); if (mg) x.margin_pct = +mg[1];
  const yr = new Date().getFullYear();

  if (dm) { const y1 = dm[1] || yr, y2 = dm[4] || y1; x.start = `${y1}-${pad(dm[2])}-${pad(dm[3])} 00:00`; x.end = `${y2}-${pad(dm[5])}-${pad(dm[6])} 23:59`; }
  if (/(トラフィック|サイト誘導|クリック)/.test(z)) x.objective = "トラフィック";
  if (/(リード|資料請求|会員登録|予約|応募)/.test(z)) x.objective = "リード";
  if (/(売上|購入|EC|コンバージョン|CV)/.test(z)) x.objective = x.platform === "TikTok" ? "ウェブサイトのコンバージョン" : "売上";
  if (/(再生|視聴)/.test(z) && x.platform === "TikTok") x.objective = "動画視聴";
  const kp = z.match(/(CPM|CPC|CPV|CPA)[^0-9\n]{0,6}([0-9][0-9,]*)/i); if (kp) { x.kpi_type = kp[1].toUpperCase(); x.kpi_value = +kp[2].replace(/,/g, ""); }
  if (/男性/.test(z) && !/女性/.test(z)) x.gender = "男性"; if (/女性/.test(z) && !/男性/.test(z)) x.gender = "女性";
  const ag = z.match(/(\d{2})\s*[〜~\-ー－]\s*(\d{2})\s*(代|歳)/); if (ag) { x.age_min = +ag[1]; x.age_max = ag[3] === "代" ? +ag[2] + 9 : +ag[2]; }
  else { const a1 = z.match(/(\d{2})代/); if (a1) { x.age_min = +a1[1]; x.age_max = +a1[1] + 9; } }
  const url = z.match(/https?:\/\/[^\s「」<>]+/); if (url) x.lp_url = url[0]; else x.missing.push("LP の URL");
  if (/首都圏/.test(z)) x.regions = ["東京都", "神奈川県", "千葉県", "埼玉県"];
  x.brief_name = [x.client, x.product].filter(Boolean).join(" ") || "新規与件";
  x.target_summary = `${x.gender === "すべて" ? "" : x.gender}${x.age_min}〜${x.age_max}歳`;
  const base = [x.product || "商品", "ショッピング（小売り）", "オンラインショッピング"].filter(Boolean);
  x.interests = { narrow: base.slice(0, 2), normal: base, wide: [...base, "エンターテインメント", "旅行"] };
  const p = x.product || "この商品";
  x.ads = [{ text: `${p}をもっと身近に。詳しくはサイトでチェック。`, headline: `${p}`.slice(0, 25), description: "詳しくはこちら", cta: "詳しくはこちら" }];
  if (!x.budget) x.missing.push("予算"); if (!x.start) x.missing.push("配信期間");
  return x;
}

    account: b.meta.account || SAMPLE_ACCOUNT[d.platform], margin: d.margin,

function shrink(file, max = 640) {
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => { const r = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement("canvas"); cv.width = img.width * r; cv.height = img.height * r; cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(img.src); res(cv.toDataURL("image/jpeg", .82)); }; img.onerror = rej; img.src = URL.createObjectURL(file); });
}
function videoThumb(file) {
  return new Promise((res, rej) => { const v = document.createElement("video"); v.muted = true; v.preload = "metadata"; v.src = URL.createObjectURL(file);
    v.onloadeddata = () => { v.currentTime = Math.min(.5, v.duration / 2 || 0); };
    v.onseeked = () => { const r = Math.min(1, 640 / Math.max(v.videoWidth, v.videoHeight)); const cv = document.createElement("canvas"); cv.width = v.videoWidth * r; cv.height = v.videoHeight * r; const g = cv.getContext("2d"); g.drawImage(v, 0, 0, cv.width, cv.height);
      g.fillStyle = "rgba(0,0,0,.45)"; g.beginPath(); g.arc(cv.width / 2, cv.height / 2, 30, 0, 7); g.fill(); g.fillStyle = "#fff"; g.beginPath(); g.moveTo(cv.width / 2 - 10, cv.height / 2 - 16); g.lineTo(cv.width / 2 + 16, cv.height / 2); g.lineTo(cv.width / 2 - 10, cv.height / 2 + 16); g.fill();
      URL.revokeObjectURL(v.src); res(cv.toDataURL("image/jpeg", .8)); };
    v.onerror = rej; });
}

  const st = guideState(); const now = GUIDE.findIndex(([k]) => !st[k]);
  g.innerHTML = `<div class="gh">使い方（${GUIDE.filter(([k]) => st[k]).length}/${GUIDE.length}）<button id="gx">✕</button></div><ol>${GUIDE.map(([k, t], i) => `<li class="${st[k] ? "done" : i === now ? "now" : ""}">${t}</li>`).join("")}</ol>
    ${now === 0 ? `<div style="padding:0 14px 12px"><button class="btn sm" id="gnew">＋ 与件を新規作成</button></div>` : ""}`;
  $("#gx").onclick = () => { S.seen.guideClosed = true; persist(); guideUpdate(); };
  const gn = $("#gnew"); if (gn) gn.onclick = () => { const b = newBrief(); persist(); go(`#/brief/${b.id}`); };
}

// ---------- 起動 ----------
(async () => {
  await loadMe(); load(); renderNav();
  window.addEventListener("hashchange", route); route();
  if (!S.seen.welcome) {
    S.seen.welcome = true; persist();
    modal(`<div class="mh"><h2>HAWK トライアルへようこそ</h2><button class="close">✕</button></div><div class="mb">
      <p>依頼メール・チャット・依頼書をそのまま貼り付けるだけで、AI が与件を読み取り、<b>オーディエンス設計 → 見積り → 配信設計</b>まで組み立てます。</p>
      <ol style="padding-left:20px;line-height:1.9"><li>「＋ 新規作成」で与件を作る</li><li>左の Notes に依頼メモを貼って → を押す（記入例もあります）</li><li>右の Menu からオーディエンス設計・見積り・配信設計を作る</li></ol>
      <p class="muted small">トライアル期間：あと ${ME.trial.daysLeft} 日 ／ 媒体への連携は正式版でご利用いただけます。サンプルの与件も入れてあります。</p></div>
      <div class="mf"><button class="btn ghost close">サンプルを見る</button><button class="btn" id="wnew">与件を作ってみる</button></div>`, { narrow: true });
    $("#wnew").onclick = () => { closeModal($("#wnew").closest(".modal")); const b = newBrief(); persist(); go(`#/brief/${b.id}`); };
  }
})();
</script>
</body>
</html>
